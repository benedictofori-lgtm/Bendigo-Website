<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bendigo Website - AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">🤖</div>
      <div>
        <h1>Bendigo AI</h1>
        <p>Your simple AI chatbot</p>
      </div>
    </header>

    <section id="chat" class="chat">
      <div class="message ai">Hello! I'm Bendigo AI. How can I help you today? 👋</div>
    </section>

    <div class="input-area">
      <input id="userInput" type="text" placeholder="Type your message..." autocomplete="off">
      <button id="sendButton">Send</button>
    </div>

    <button id="clearButton" class="clear">Clear chat</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
