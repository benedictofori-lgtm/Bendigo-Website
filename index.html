<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bendigo Website - AI Chatbot & Code Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">🤖</div>
        <div>
          <strong>Bendigo AI</strong>
          <span>Assistant</span>
        </div>
      </div>

      <button id="newChatButton" class="side-button">＋ New Chat</button>

      <div class="side-section">
        <p>MENU</p>
        <button id="historyButton" class="side-link">🕘 Chat History</button>
        <button id="settingsButton" class="side-link">⚙️ Settings</button>
        <button id="aboutButton" class="side-link">ℹ️ About Bendigo</button>
      </div>

      <div class="sidebar-bottom">
        <span>● Online</span>
        <small>No API key required</small>
      </div>
    </aside>

    <section class="main-chat">
      <header>
        <div class="header-logo">🤖</div>
        <div>
          <h1>Bendigo AI</h1>
          <p>Your simple AI chatbot + coding lab</p>
        </div>
      </header>

      <section id="chat" class="chat">
        <div class="message ai">Hello! I'm Bendigo AI. How can I help you today? 👋</div>
      </section>

      <div class="input-area">
        <input id="userInput" type="text" placeholder="Type or speak your message..." autocomplete="off">
        <button id="voiceButton" type="button" title="Speak">🎤</button>
        <button id="sendButton" type="button">Send</button>
      </div>

      <p id="voiceStatus" class="voice-status"></p>
      <button id="clearButton" class="clear" type="button">Clear chat</button>

      <section class="code-lab">
        <div class="code-lab-header">
          <div>
            <h2>💻 Bendigo Code Lab</h2>
            <p>Write HTML, CSS and JavaScript, then run it instantly.</p>
          </div>
          <button id="runCodeButton" type="button">▶ Run Code</button>
        </div>

        <div class="editor-grid">
          <div class="editor-box">
            <label for="htmlCode">HTML</label>
            <textarea id="htmlCode" spellcheck="false"><h2>Hello Bendigo! 👋</h2>
<p>My first webpage is working.</p>
<button onclick="sayHello()">Click Me</button></textarea>
          </div>

          <div class="editor-box">
            <label for="cssCode">CSS</label>
            <textarea id="cssCode" spellcheck="false">body {
  font-family: Arial, sans-serif;
  padding: 25px;
  text-align: center;
}
button {
  padding: 10px 18px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}</textarea>
          </div>

          <div class="editor-box">
            <label for="jsCode">JavaScript</label>
            <textarea id="jsCode" spellcheck="false">function sayHello() {
  alert("Hello from Bendigo Code Lab!");
}</textarea>
          </div>
        </div>

        <div class="preview-title">Live Preview</div>
        <iframe id="codePreview" title="Code preview" sandbox="allow-scripts"></iframe>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
